# GitHub Actions：Windows 下用 Nuitka 编译 shunshu 成 standalone 目录。
#
# 触发方式：
#   1. push 到 main 分支 → 跑测试 + 打包 + 按 pyproject.toml 的版本号自动发布 Release
#   2. push tag v*       → 同上，Release 挂在这个 tag 上
#   3. 手动 dispatch      → 和 main 分支一样
#
# 也就是说：不需要在本地手动打 tag，改完代码把版本号往上推一次，Release 就跟着更新；就算忘了抬
# 版本号，这一版也已经发过了，CI 照样往后走一个空闲号发成新包。
#
# 发版号由最前面的 plan job 定，规则是**每次 push 都发一个没发过的号，绝不覆盖已经发出去的包**：
# pyproject 那个号还没打过 tag 就直接用它（正常发版仍是「改版本号 + push」），tag 已经存在就 patch
# 往后找第一个空闲的号。于是忘抬版本号又推一次 = 多发一份新包，而不是把上一次 Release 的内容悄悄
# 换掉——旧包的下载链接永远指向它当初那份东西。
#
# 产物（每次 push 都发到 Releases；Linux 的 tar.gz/deb 在 ubuntu:26.10 容器里编，见 build-ubuntu）：
#   shunshu-{版本}-windows-amd64.zip        ← folder 模式：exe + 运行时依赖目录
#     ├── shunshu.exe                          主程序 + popup 子命令，同一个 exe
#     └── 运行时依赖（含 zhconv 词库、Tk、pystray/PIL 后端）
#   shunshu-{版本}-windows-amd64-onefile.exe ← 单文件模式：一个 exe 拷走即用
#   shunshu-{版本}-linux-x86_64.tar.gz       ← Ubuntu 26.04/26.10 解压即用（容器里编的那份）
#   shunshu-{版本}-linux-amd64.deb           同一套东西搬进 /opt/shunshu + 软链 + .desktop
#   shunshu-{版本}-py3-none-any.whl          ← 别的发行版用的纯 Python wheel（gi 走目标机 apt）
#   install-linux.sh                           一条命令装好：apt 依赖 → 系统 python3 的 venv → 自检托盘后端

name: Build

# 同一分支/同一 tag 的 run 排队跑，别并发：两次 run 会抢着写同一条 Release，
# 后完成的那次覆盖前一次的正文与资产（实测过——旧 workflow 那次后跑完，把发布页正文
# 从变更记录的实际内容盖回了自动生成的 compare 链接）
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  # ------------------------------------------------------------------
  # 先发版号，再编译：每次 push 都要发一个**没发过**的号，已经发过的绝不覆盖。
  #
  # pyproject 那个号还没打过 tag 就直接用它（正常发版就是「改版本号 + push」）；tag 已经
  # 存在（这版发过了，或者忘抬号又推了一次）就 patch 往后找第一个空闲的。两个 build job 都
  # 照这里的输出改写自己检出里的 pyproject/uv.lock，wheel 文件名、deb 的 Version、产物里的
  # VERSION 才会是同一个号。
  # ------------------------------------------------------------------
  plan:
    name: Plan release version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.plan.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pick a version that has not been released yet
        id: plan
        run: |
          mkdir -p .tmp
          # ls-remote 不用 GitHub API（匿名调用限流很紧），tag 列表一次就够
          git ls-remote --tags origin > .tmp/tags.txt
          version=$(python3 scripts/plan_release.py --tags .tmp/tags.txt)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "本次发版：v$version（pyproject 里写的是 v$(sed -n 's/^version = \"\([^\"]*\)\".*/\1/p' pyproject.toml | head -1)）"

  build:
    name: Windows Build
    runs-on: windows-latest
    needs: plan
    # 建 Release 需要写权限：默认的 GITHUB_TOKEN 只有读权限，
    # 不写这行会在 Create GitHub Release 一步报 403 Resource not accessible by integration
    permissions:
      contents: write
    outputs:
      release_created: ${{ steps.create_release.outputs.id != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          # 不要写 cache: "uv"：setup-python 的内置缓存只认 pip/pipenv/cargo，
          # 填 uv 会在这一步直接失败（Error: Caching for 'uv' is not supported）

      # 把 plan 选出来的号写进 pyproject 与 uv.lock：Nuitka 打进去的 VERSION、onefile 的
      # product-version、zip 的文件名都从 pyproject 取，三处必须是同一个号。放在 setup-python
      # 之后是用它的 python 命令（Windows runner 上 python3 这个名字不保证有），且必须早于
      # uv sync——锁与 pyproject 的版本不一致 uv 会直接报错
      - name: Apply the planned version
        run: python scripts/plan_release.py --set-version "${{ needs.plan.outputs.version }}" --apply

      - name: Install uv
        run: pip install uv

      - name: Sync dependencies (including dev + nuitka)
        run: uv sync --group dev

      - name: Run tests
        run: uv run pytest tests/ -v

      # ---------- Nuitka 编译 ----------
      # 版本号先落成数据文件打进产物：Nuitka 的 standalone 目录里没有 dist-info，
      # importlib.metadata 读不到版本，崩溃日志只能写 v0.0.0（v0.16.0 那次现场就这样，
      # 看日志认不出是哪一版）。__init__ 在元数据缺失时会退回来读产物里的 VERSION。
      - name: Write VERSION for the packaged build
        shell: pwsh
        run: |
          $version = (Select-String -Path pyproject.toml -Pattern '^version = "(.+?)"').Matches.Groups[1].Value
          New-Item -ItemType Directory -Force -Path .tmp | Out-Null
          Set-Content -Path .tmp\VERSION -Value $version -NoNewline -Encoding ascii

      # --assume-yes-for-downloads：Nuitka 要用 Dependency Walker 分析扩展模块依赖，
      # 会问「可以下载吗」，非交互模式下默认答 no 直接 FATAL
      # 入口传包目录 src/shunshu 而不是 __main__.py：产物目录才是 shunshu.dist
      - name: Nuitka compile (standalone folder)
        run: |
          uv run python -m nuitka `
            --standalone `
            --assume-yes-for-downloads `
            --windows-console-mode=disable `
            --enable-plugin=tk-inter `
            --include-package=shunshu `
            --include-package=pystray `
            --include-module=zhconv `
            --include-package-data=zhconv `
            --include-module=truststore `
            --include-data-file=.tmp\VERSION=VERSION `
            --output-dir=dist `
            --no-deployment-flag=self-execution `
            src/shunshu `
            --output-filename=shunshu.exe

      # ---------- 单文件 exe ----------
      # --onefile-cache-mode=cached：解包目录固定为 {CACHE_DIR}/{COMPANY}/{PRODUCT}/{VERSION}，
      # 主进程与弹卡片的子进程共用同一份解包，不至于每弹一次卡都重解一遍；
      # 因此必须给 company/product/version 元数据，否则该模式默认路径里的占位符无值可用
      - name: Nuitka compile (single file)
        shell: pwsh
        run: |
          $version = (Select-String -Path pyproject.toml -Pattern '^version = "(.+?)"').Matches.Groups[1].Value
          uv run python -m nuitka `
            --onefile `
            --onefile-cache-mode=cached `
            --company-name=cfco `
            --product-name=shunshu `
            --product-version=$version `
            --file-version=$version `
            --assume-yes-for-downloads `
            --windows-console-mode=disable `
            --enable-plugin=tk-inter `
            --include-package=shunshu `
            --include-package=pystray `
            --include-module=zhconv `
            --include-package-data=zhconv `
            --include-module=truststore `
            --include-data-file=.tmp\VERSION=VERSION `
            --no-deployment-flag=self-execution `
            --output-dir=dist-onefile `
            src/shunshu `
            --output-filename="shunshu-$version-windows-amd64-onefile.exe"

      # ---------- 打包 zip ----------
      - name: Package zip
        shell: pwsh
        run: |
          $version = (Select-String -Path pyproject.toml -Pattern '^version = "(.+?)"').Matches.Groups[1].Value
          $dir = "dist\shunshu.dist"
          $zip = "shunshu-$version-windows-amd64.zip"
          # 把 exe 提到根目录，_internal 放旁边，和 PyInstaller 产物结构一致
          Compress-Archive -Path "$dir\*" -DestinationPath $zip -CompressionLevel Optimal
          Write-Host "Created $zip ($([math]::Round((Get-Item $zip).Length / 1MB, 1)) MB)"

      # ---------- 上传到 Actions Artifacts ----------
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: shunshu-windows-amd64
          path: "shunshu-*.zip"
          if-no-files-found: error
          retention-days: 7

      # ---------- 发布标签：push main 用 pyproject 里的版本号，push tag 用 tag 名 ----------
      - name: Resolve release tag
        id: tag
        shell: pwsh
        run: |
          if ("${{ github.ref }}" -like "refs/tags/v*") {
            $name = "${{ github.ref_name }}"
          } else {
            $version = (Select-String -Path pyproject.toml -Pattern '^version = "(.+?)"').Matches.Groups[1].Value
            $name = "v$version"
          }
          "name=$name" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Release tag: $name"

      # ---------- 发布页正文 = README「变更记录」里这一条的实际内容 ----------
      # 不用 GitHub 自动生成的 notes（那是合并请求清单加一串 Full Changelog 链接，
      # 点开什么也看不见）。README 里一条日志是一整行，脚本按 ①②③ 拆成项目符号。
      # 两个 job 共用 scripts/release_notes.py，正文只有一份来源
      - name: Build release notes
        shell: pwsh
        run: uv run python scripts/release_notes.py --version "${{ steps.tag.outputs.name }}" --commit-message "$(git log -1 --pretty=%s)" --out release-notes.md

      # ---------- 自动发布 Release（开源项目：每次 push 都要有可下载的 exe） ----------
      # tag 不存在时 action-gh-release 会就地建 tag，不用本地手动打
      - name: Publish GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: Shunshu ${{ steps.tag.outputs.name }}
          body_path: release-notes.md
          fail_on_unmatched_files: true
          files: |
            shunshu-*.zip
            dist-onefile/shunshu-*-onefile.exe

  # ------------------------------------------------------------------
  # Ubuntu 产物：照旧出 Nuitka standalone 的 tar.gz 与 deb，但**编译环境换成 ubuntu:26.10
  # 的容器**（host 仍是 ubuntu-latest，用户态、python3.14、apt 的 gi 都是 26.10 的）。
  #
  # 为什么要换编译环境：右键菜单只有 pystray 的 appindicator/gtk 后端渲染得出来，这两个
  # 后端要 apt 的 gi（PyGObject）+ GTK3 + appindicator 的 typelib，pip 装不出 gi。以前在
  # ubuntu-24.04 的 runner 上编，Nuitka 的 gi 插件会把编译机那份 gi 连系统整目录的 typelib
  # 快照一起打进产物，运行时又把 GI_TYPELIB_PATH 指向快照——换到 Ubuntu 26.10（gi 3.57、
  # gtk 3.24.52、g-i 1.86）就是本机 libgdk 对不上快照，启动崩成一句没有文字的 AssertionError
  # （gi/overrides/Gdk.py 里 `assert g_type != TYPE_NONE`），而 CI 在编译机上全绿：快照把
  # 「目标机缺东西 / 版本对不上」整个糊住了。编译机与目标机是同一个发行版，快照才有意义。
  #
  # 代价说清楚：这个包的 glibc 下限、python ABI 与 gi 快照都按 26.10 对齐，别的发行版（或
  # 以后 Ubuntu 换成 gobject-introspection 2.0）不保证跑得起来——所以同一个 Release 上还留
  # 一份 py3-none-any 的 wheel 与 scripts/install-linux.sh，那条路 gi 全用目标机自己那套。
  #
  # 发版动作不变：push 到 main 就自动出包并更新 Release，不需要手动打 tag。
  # ------------------------------------------------------------------
  build-ubuntu:
    name: Ubuntu 26.10 Build
    runs-on: ubuntu-latest
    # needs build：Release 由 Windows 那次建，这次往同一个 Release 追加资产，两个 job 不能
    # 抢着建同名 tag；needs plan 是为了拿到与 Windows 完全相同的发版号（两边必须落在同一个 Release）
    needs: [build, plan]
    # Windows job 失败也照样出 Linux 包：两个平台的编译不该互相绑死
    if: ${{ !cancelled() }}
    container:
      image: ubuntu:26.10
      options: --user root
    permissions:
      contents: write
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      # 容器 job 里 actions/checkout 要用镜像内的 git/curl/tar，sudo 也不需要（就是 root）。
      # python3-gi + gir1.2-* 是「有没有右键菜单」的那一线；python3-xlib 是 pystray 的 xorg
      # 兜底后端；python3-tk 是卡片的渲染层；patchelf/gcc 给 Nuitka 用；xvfb + dbus 给自检用
      # （appindicator 往会话总线注册，纯 xvfb 没有那条总线）。
      # 26.10 把 python3-tk / python3-xlib / legacy appindicator 的 gir 挪进了 universe，
      # 干净镜像里 universe 未必开着，先开；两个 appindicator typelib 包都试装——pystray 先试
      # AppIndicator3、ValueError 才退 AyatanaAppIndicator3，只装一个时另一个在 Nuitka 分析
      # 阶段解析不到 typelib 会直接 FATAL。DBus-1.0.typelib 由 gir1.2-freedesktop 带，
      # pystray/_util/notify_dbus.py 在 import 时无条件 require_version('DBus','1.0')。
      - name: Bootstrap the container
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            git curl ca-certificates tar xz-utils \
            software-properties-common \
            python3 python3-venv python3-pip python3-dev python3-tk \
            python3-gi python3-xlib patchelf gcc \
            gir1.2-glib-2.0 gir1.2-freedesktop gir1.2-gtk-3.0 libgtk-3-0t64 \
            xvfb dbus
          add-apt-repository -y universe || true
          apt-get update || true
          for pkg in gir1.2-appindicator3-0.1 gir1.2-ayatanaappindicator3-0.1; do
            apt-get install -y --no-install-recommends "$pkg" \
              || echo "这个发行版没有 $pkg，pystray 会退到另一个后端"
          done

      - name: Checkout
        uses: actions/checkout@v4

      # 与 Windows 那个 job 同一个发版号：wheel 文件名、deb 的 Version、产物里的 VERSION
      # 都从改写后的 pyproject 取，两边才会挂到同一个 Release 上
      - name: Apply the planned version
        run: python3 scripts/plan_release.py --set-version "${{ needs.plan.outputs.version }}" --apply

      - name: Resolve version
        id: version
        run: |
          v=$(sed -n 's/^version = "\([^"]*\)".*/\1/p' pyproject.toml | head -1)
          echo "value=$v" >> "$GITHUB_OUTPUT"
          # Nuitka 的产物里没有 dist-info，importlib.metadata 读不到版本，崩溃日志会写成
          # v0.0.0（v0.16.0 那次现场就是这样）。把版本号当数据文件打进产物，__init__ 退回来读它
          mkdir -p .tmp
          printf '%s' "$v" > .tmp/VERSION

      # 依赖版本仍由 uv.lock 说了算（uv export 出来喂 pip），但解释器必须是 apt 那个 python3，
      # 否则看不见 gi。系统 python 被 PEP 668 标成 externally-managed，所以 uv 装在临时 venv 里
      - name: Create venv on the system interpreter
        run: |
          python3 -m venv .venv-build
          .venv-build/bin/python -m pip install --quiet uv
          .venv-build/bin/uv export --frozen --no-dev --no-hashes --no-emit-project -o .tmp/requirements.txt
          python3 -m venv --system-site-packages .venv-linux
          .venv-linux/bin/python -m pip install --quiet -U pip
          .venv-linux/bin/python -m pip install --quiet -r .tmp/requirements.txt pytest nuitka
          .venv-linux/bin/python -c "import gi; gi.require_version('Gtk', '3.0'); \
            from gi.repository import Gtk; print('gi + Gtk 3.0 ok')"

      # ---------- 产物里那句 sys.path.append 到底管不管用，单独问 ----------
      # v0.19.1 的冒烟掉到了 `_xorg`（说明 `import gi` 在产物里就没成），但整包跑一趟要 6 分钟，
      # 而且只能看出「成了/没成」。这里拿**同一组 gi 参数**编一个几行的探针，一分钟内出结论：
      # 挂上 dist-packages 之后 `import gi` 是什么结果、四个 typelib 各自 require 得到吗。
      #
      # 放在测试之前：v0.19.2 那轮测试步骤一红，这条探针就排在后面压根没跑。它不判失败，
      # 只回答问题，所以不该被任何一步的红挡在后面。
      - name: Probe system gi inside a Nuitka bundle
        run: |
          mkdir -p .tmp/giprobe
          cat > .tmp/giprobe/probe.py <<'PY'
          import sys
          sys.path.append("/usr/lib/python3/dist-packages")
          print("sys.path 末尾:", sys.path[-1])
          try:
              import gi
          except BaseException as exc:
              print("产物里 import gi 失败:", type(exc).__name__, exc)
              raise SystemExit(0)
          print("产物里 import gi ok:", gi.__file__)
          for namespace, version in (("Gtk", "3.0"), ("AppIndicator3", "0.1"),
                                     ("AyatanaAppIndicator3", "0.1"), ("DBus", "1.0")):
              try:
                  gi.require_version(namespace, version)
                  print("require_version", namespace, "ok")
              except BaseException as exc:
                  print("require_version", namespace, "失败:", type(exc).__name__, exc)
          PY
          .venv-linux/bin/python -m nuitka --standalone --assume-yes-for-downloads \
            --disable-plugins=gi --no-deployment-flag=excluded-module-usage \
            --nofollow-import-to=gi --nofollow-import-to='gi.*' \
            --output-filename=probe --output-dir=.tmp/giprobe/out .tmp/giprobe/probe.py
          # Linux 上不加 --output-filename 时产物叫 probe.bin；v0.19.3 那轮这一步「成功」了但
          # 探针压根没跑（`.tmp/giprobe/out/probe.dist/probe: not found` 被 || true 糊掉了）。
          # 找不到可执行就当场说死，别让一条假绿骗人。
          test -x .tmp/giprobe/out/probe.dist/probe || {
            echo "探针产物不在预期路径，列一下真名："; ls -l .tmp/giprobe/out/probe.dist; exit 1; }
          .tmp/giprobe/out/probe.dist/probe > .tmp/giprobe/result.txt 2>&1 || true
          cat .tmp/giprobe/result.txt
          {
            echo "### 产物里取系统 gi 的探针"
            echo '```'
            cat .tmp/giprobe/result.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run tests (headless X)
        run: xvfb-run -a .venv-linux/bin/python -m pytest tests -q

      # ---------- 编译前先把「这台机器能不能用带菜单的后端」问清楚 ----------
      # 放在 Nuitka 之前是因为它几秒就出结果，而编译 FATAL 要等几分钟才报，现场还只说
      # 「Typelib file for namespace X not found」，看不出是缺 apt 包还是打包参数的问题。
      - name: Check tray backends before compiling
        run: |
          mkdir -p .tmp
          xvfb-run -a .venv-linux/bin/python - > .tmp/backend-check.txt 2>&1 <<'PY' || true
          import gi
          versions = {"Gtk": "3.0", "GLib": "2.0", "GObject": "2.0", "Gio": "2.0",
                      "DBus": "1.0", "AppIndicator3": "0.1", "AyatanaAppIndicator3": "0.1"}
          for namespace, version in versions.items():
              try:
                  gi.require_version(namespace, version)
                  print(f"typelib {namespace} {version}: 有")
              except ValueError as exc:
                  print(f"typelib {namespace} {version}: 没有 -> {exc}")
          for name in ("_appindicator", "_gtk", "_xorg"):
              try:
                  __import__("pystray" + "." + name)
                  print(f"后端 pystray{name}: 能 import")
              except Exception as exc:
                  print(f"后端 pystray{name}: 不行 -> {type(exc).__name__}: {exc}")
          import pystray
          print("pystray 实际选中的后端:", pystray.Icon.__module__)
          PY
          cat .tmp/backend-check.txt
          {
            echo "### 编译容器里的托盘后端可用性"
            echo '```'
            cat .tmp/backend-check.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          grep -q "pystray 实际选中的后端: pystray._\(appindicator\|gtk\)" .tmp/backend-check.txt \
            || echo "::warning::编译容器选不到带右键菜单的后端，产物的托盘可能只有图标"

      # ---------- wheel 与安装脚本：给不是 26.10 的机器留的路 ----------
      # 纯 Python、没有 C 扩展，一个 py3-none-any 通吃 3.12/3.13/3.14；gi 不进包，由 apt 提供
      - name: Build wheel
        run: |
          .venv-build/bin/uv build --wheel --out-dir dist-wheel
          ls -l dist-wheel

      # 用户在 Ubuntu 上敲的就是这一条（这里只把「从 Releases 下载」换成刚编出来的本地 wheel）
      - name: Run the wheel installer (other releases)
        run: |
          SHUNSHU_WHEEL="$GITHUB_WORKSPACE/dist-wheel/shunshu-${{ steps.version.outputs.value }}-py3-none-any.whl" \
            bash scripts/install-linux.sh

      # 与 Windows 那两条同一组关键参数；差别只在：没有 --windows-console-mode、把 Windows/macOS
      # 的后端排除掉，以及 **gi 干脆不编进产物**（--disable-plugins=gi 关掉 gi 插件的 typelib 快照
      # 复制，--nofollow-import-to 让 pystray 的那句 import gi 不产生冻结模块）。v0.17.0 两轮现场：
      # 在 24.04 上编 → 26.10 装上去崩在 `assert g_type != TYPE_NONE`（快照对不上本机 libgdk）；
      # 改在 26.10 容器里编 → 同一个容器里仍崩在 `unix_signal_add_full was set deprecated but
      # wasn't added to __all__`（3.57 的 gi/overrides 与新版 glib 把 unix_* 拆到 GLibUnix-2.0
      # 这件事对不上）。同一套 apt 的 gi 在 wheel 那条路上是全绿的，所以运行时用系统那一份：
      # packaging.expose_system_gi() 只在 Linux 打包态把 /usr/lib/python3/dist-packages 挂到
      # sys.path 末尾。代价是这个包绑目标机的 python 小版本（产物是 3.14 的 ABI），跨版本请用
      # 同一个 Release 里的 wheel + install-linux.sh
      #
      # `--no-deployment-flag=excluded-module-usage` 是这条路的开关，少它整套都不成立：Nuitka 对
      # `--nofollow-import-to` 的模块默认在**运行时也拒绝 import**，v0.19.3 的冒烟里产物那行写得很清楚
      # `import gi: ImportError: Module 'gi' was actively excluded from Nuitka compilation.
      # Disable with '--no-deployment-flag=excluded-module-usage'` —— 光 append dist-packages 到
      # sys.path 是没用的，得先把这道闸门放开，pystray 才轮得到 _appindicator。
      - name: Nuitka compile (standalone folder)
        run: |
          .venv-linux/bin/python -m nuitka \
            --standalone \
            --assume-yes-for-downloads \
            --enable-plugin=tk-inter \
            --disable-plugins=gi \
            --no-deployment-flag=excluded-module-usage \
            --nofollow-import-to=gi \
            --nofollow-import-to=gi.* \
            --include-package=shunshu \
            --include-package=pystray \
            --nofollow-import-to=pystray._win32 \
            --nofollow-import-to=pystray._darwin \
            --include-module=zhconv \
            --include-package-data=zhconv \
            --include-module=truststore \
            --include-data-file=.tmp/VERSION=VERSION \
            --no-deployment-flag=self-execution \
            --output-dir=dist-linux \
            src/shunshu \
            --output-filename=shunshu

      # ---------- 产物自测：CI 能证明的到此为止，见 README 的 Ubuntu 一节 ----------
      # 空书架跑一遍：验「产物起得来、托盘后端是哪个、卡片子进程真能活过启动窗口」。
      # 关键一条：跑的就是这个容器里真实的那套 GTK3/gi，产物里打包态读版本号也走 VERSION 文件。
      - name: Smoke test the built bundle
        run: |
          set -uo pipefail
          data="$RUNNER_TEMP/shunshu-smoke"
          rm -rf "$data"; mkdir -p "$data"
          # runner 用 bash -e 执行 step：timeout 返回 124（= 撑到被收掉，正是我们要的）
          # 会被 -e 当成失败当场中止，后面的判断根本跑不到。必须显式吃下退出码
          code=0
          SHUNSHU_DATA_DIR="$data" timeout 30 xvfb-run -a \
            ./dist-linux/shunshu.dist/shunshu run --boot-delay=1 >"$data/stdout.log" 2>&1 || code=$?
          echo "--- shunshu.log ---"; cat "$data/shunshu.log" 2>/dev/null || echo "(没有 shunshu.log)"
          echo "--- stdout/stderr ---"; cat "$data/stdout.log"
          if [ "$code" -ne 124 ]; then
            echo "产物没撑到 timeout（exit=$code），启动就崩了"; exit 1
          fi
          grep -q "托盘后端:" "$data/shunshu.log" || {
            echo "没写到托盘后端那行：run() 之前就没跑起来"; exit 1; }
          backend=$(sed -n 's/.*托盘后端: \([^（]*\).*/\1/p' "$data/shunshu.log" | tail -1)
          echo "托盘后端：$backend"
          case "$backend" in
            _appindicator|_gtk) ;;
            *) echo "托盘后端是 $backend，产物没有右键菜单，不能发"; exit 1 ;;
          esac
          grep -q "顺手 · 启动检查" "$data/alerts.log" || {
            echo "启动那张卡没记进 alerts.log：notify/show 没走到"; exit 1; }
          if grep -q "卡片没弹出" "$data/alerts.log"; then
            echo "卡片子进程弹失败（看上一行的原因）"; exit 1
          fi
          echo "托盘后端 \`$backend\`，卡片子进程活着 —— 已写进 Release 说明" >> "$GITHUB_STEP_SUMMARY"
          rm -rf .tmp/smoke-data; cp -r "$data" .tmp/smoke-data
          cp .tmp/backend-check.txt .tmp/smoke-data/ 2>/dev/null || true

      - name: Upload smoke log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shunshu-ubuntu-smoke-log
          path: ".tmp/smoke-data"
          if-no-files-found: warn
          retention-days: 7

      # 二进制放压缩包根目录（与 Windows 的 zip 同构）；deb 把那串 .so 搬到 /opt 而不是 apt 装，
      # typelib 仍然不搬（编译机就是目标发行版，快照对齐，但 apt 那三个包仍要装，见 Depends）
      - name: Package tar.gz
        run: |
          version="${{ steps.version.outputs.value }}"
          tar -czf "shunshu-$version-linux-x86_64.tar.gz" -C dist-linux/shunshu.dist .
          ls -lh "shunshu-$version-linux-x86_64.tar.gz"

      - name: Package deb
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.value }}"
          deb="shunshu-$version-linux-amd64.deb"
          rm -rf .tmp/deb
          mkdir -p .tmp/deb/DEBIAN .tmp/deb/opt/shunshu .tmp/deb/usr/bin \
                   .tmp/deb/usr/share/applications
          cp -r dist-linux/shunshu.dist/. .tmp/deb/opt/shunshu/
          ln -s /opt/shunshu/shunshu .tmp/deb/usr/bin/shunshu
          cat > .tmp/deb/DEBIAN/control <<CTRL
          Package: shunshu
          Version: $version
          Architecture: amd64
          Section: utils
          Priority: optional
          Maintainer: cfco <minyaohua@gmail.com>
          Depends: python3-gi, python3-tk, gir1.2-gtk-3.0, gir1.2-glib-2.0, gir1.2-freedesktop, libgtk-3-0t64, python3-xlib, gir1.2-appindicator3-0.1 | gir1.2-ayatanaappindicator3-0.1
          Description: 小说目录页更新监控（托盘常驻 + 弹窗提醒）
           抓小说目录页、认出章节容器、有新章就在右上角弹卡片。没有窗口界面，
           添加、删除、改间隔全在托盘右键菜单里。数据目录 ~/.local/share/shunshu。
           gi（PyGObject）不打进包里，由 Depends 里的 python3-gi 提供（apt 那份才与本机
           glib/GTK3 同源）；包本身是 ubuntu:26.10 的 python3.14 ABI，跨发行版或换了
           python 小版本请用同一个 Release 里的 wheel + install-linux.sh。
          CTRL
          cat > .tmp/deb/usr/share/applications/shunshu.desktop <<DESK
          [Desktop Entry]
          Type=Application
          Name=顺手
          Exec=/usr/bin/shunshu
          Terminal=false
          Categories=Utility;
          StartupNotify=false
          DESK
          dpkg-deb --root-owner-group --build .tmp/deb "$deb"
          dpkg-deb --info "$deb" | sed -n '1,20p'
          ls -lh "$deb"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: shunshu-linux-x86_64
          path: |
            shunshu-*-linux-x86_64.tar.gz
            shunshu-*-linux-amd64.deb
            dist-wheel/shunshu-*.whl
            scripts/install-linux.sh
          if-no-files-found: error
          retention-days: 7

      - name: Resolve release tag
        id: tag
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "name=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=v${{ steps.version.outputs.value }}" >> "$GITHUB_OUTPUT"
          fi

      # 与 Windows 那步同一份脚本、同一份正文（纯标准库，系统 python3 就够）
      - name: Build release notes
        run: python3 scripts/release_notes.py --version "${{ steps.tag.outputs.name }}" --commit-message "$(git log -1 --pretty=%s)" --out release-notes.md

      # Windows job 已经建过同名 tag 的 Release，这里是往同一个 Release 追加文件，不会建出第二个
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          body_path: release-notes.md
          fail_on_unmatched_files: true
          files: |
            shunshu-*-linux-x86_64.tar.gz
            shunshu-*-linux-amd64.deb
            dist-wheel/shunshu-*.whl
            scripts/install-linux.sh
