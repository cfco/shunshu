# GitHub Actions：Windows 下用 Nuitka 编译 shunshu 成 standalone 目录。
#
# 触发方式：
#   1. push 到 main 分支 → 跑测试 + 打包 + 按 pyproject.toml 的版本号自动发布 Release
#   2. push tag v*       → 同上，Release 挂在这个 tag 上
#   3. 手动 dispatch      → 和 main 分支一样
#
# 也就是说：不需要在本地手动打 tag，改完代码把版本号往上推一次，Release 就跟着更新。
#
# 产物（每次 push 都会发到 Releases）：
#   shunshu-{版本}-windows-amd64.zip        ← folder 模式：exe + 运行时依赖目录
#     ├── shunshu.exe                          主程序 + popup 子命令，同一个 exe
#     └── 运行时依赖（含 zhconv 词库、Tk、pystray/PIL 后端）
#   shunshu-{版本}-windows-amd64-onefile.exe ← 单文件模式：一个 exe 拷走即用
#   shunshu-{版本}-py3-none-any.whl          ← Linux 用的纯 Python wheel（没有 C 扩展，跨发行版通吃）
#   scripts/install-linux.sh                   一条命令装好：apt 依赖 → 系统 python3 的 venv → 自检托盘后端

name: Build

# 同一分支/同一 tag 的 run 排队跑，别并发：两次 run 会抢着写同一条 Release，
# 后完成的那次覆盖前一次的正文与资产（实测过——旧 workflow 那次后跑完，把发布页正文
# 从变更记录的实际内容盖回了自动生成的 compare 链接）
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    name: Windows Build
    runs-on: windows-latest
    # 建 Release 需要写权限：默认的 GITHUB_TOKEN 只有读权限，
    # 不写这行会在 Create GitHub Release 一步报 403 Resource not accessible by integration
    permissions:
      contents: write
    outputs:
      release_created: ${{ steps.create_release.outputs.id != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          # 不要写 cache: "uv"：setup-python 的内置缓存只认 pip/pipenv/cargo，
          # 填 uv 会在这一步直接失败（Error: Caching for 'uv' is not supported）

      - name: Install uv
        run: pip install uv

      - name: Sync dependencies (including dev + nuitka)
        run: uv sync --group dev

      - name: Run tests
        run: uv run pytest tests/ -v

      # ---------- Nuitka 编译 ----------
      # --assume-yes-for-downloads：Nuitka 要用 Dependency Walker 分析扩展模块依赖，
      # 会问「可以下载吗」，非交互模式下默认答 no 直接 FATAL
      # 入口传包目录 src/shunshu 而不是 __main__.py：产物目录才是 shunshu.dist
      - name: Nuitka compile (standalone folder)
        run: |
          uv run python -m nuitka `
            --standalone `
            --assume-yes-for-downloads `
            --windows-console-mode=disable `
            --enable-plugin=tk-inter `
            --include-package=shunshu `
            --include-package=pystray `
            --include-module=zhconv `
            --include-package-data=zhconv `
            --include-module=truststore `
            --output-dir=dist `
            --no-deployment-flag=self-execution `
            src/shunshu `
            --output-filename=shunshu.exe

      # ---------- 单文件 exe ----------
      # --onefile-cache-mode=cached：解包目录固定为 {CACHE_DIR}/{COMPANY}/{PRODUCT}/{VERSION}，
      # 主进程与弹卡片的子进程共用同一份解包，不至于每弹一次卡都重解一遍；
      # 因此必须给 company/product/version 元数据，否则该模式默认路径里的占位符无值可用
      - name: Nuitka compile (single file)
        shell: pwsh
        run: |
          $version = (Select-String -Path pyproject.toml -Pattern '^version = "(.+?)"').Matches.Groups[1].Value
          uv run python -m nuitka `
            --onefile `
            --onefile-cache-mode=cached `
            --company-name=cfco `
            --product-name=shunshu `
            --product-version=$version `
            --file-version=$version `
            --assume-yes-for-downloads `
            --windows-console-mode=disable `
            --enable-plugin=tk-inter `
            --include-package=shunshu `
            --include-package=pystray `
            --include-module=zhconv `
            --include-package-data=zhconv `
            --include-module=truststore `
            --no-deployment-flag=self-execution `
            --output-dir=dist-onefile `
            src/shunshu `
            --output-filename="shunshu-$version-windows-amd64-onefile.exe"

      # ---------- 打包 zip ----------
      - name: Package zip
        shell: pwsh
        run: |
          $version = (Select-String -Path pyproject.toml -Pattern '^version = "(.+?)"').Matches.Groups[1].Value
          $dir = "dist\shunshu.dist"
          $zip = "shunshu-$version-windows-amd64.zip"
          # 把 exe 提到根目录，_internal 放旁边，和 PyInstaller 产物结构一致
          Compress-Archive -Path "$dir\*" -DestinationPath $zip -CompressionLevel Optimal
          Write-Host "Created $zip ($([math]::Round((Get-Item $zip).Length / 1MB, 1)) MB)"

      # ---------- 上传到 Actions Artifacts ----------
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: shunshu-windows-amd64
          path: "shunshu-*.zip"
          if-no-files-found: error
          retention-days: 7

      # ---------- 发布标签：push main 用 pyproject 里的版本号，push tag 用 tag 名 ----------
      - name: Resolve release tag
        id: tag
        shell: pwsh
        run: |
          if ("${{ github.ref }}" -like "refs/tags/v*") {
            $name = "${{ github.ref_name }}"
          } else {
            $version = (Select-String -Path pyproject.toml -Pattern '^version = "(.+?)"').Matches.Groups[1].Value
            $name = "v$version"
          }
          "name=$name" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Release tag: $name"

      # ---------- 发布页正文 = README「变更记录」里这一条的实际内容 ----------
      # 不用 GitHub 自动生成的 notes（那是合并请求清单加一串 Full Changelog 链接，
      # 点开什么也看不见）。README 里一条日志是一整行，脚本按 ①②③ 拆成项目符号。
      # 两个 job 共用 scripts/release_notes.py，正文只有一份来源
      - name: Build release notes
        shell: pwsh
        run: uv run python scripts/release_notes.py --version "${{ steps.tag.outputs.name }}" --out release-notes.md

      # ---------- 自动发布 Release（开源项目：每次 push 都要有可下载的 exe） ----------
      # tag 不存在时 action-gh-release 会就地建 tag，不用本地手动打
      - name: Publish GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: Shunshu ${{ steps.tag.outputs.name }}
          body_path: release-notes.md
          fail_on_unmatched_files: true
          files: |
            shunshu-*.zip
            dist-onefile/shunshu-*-onefile.exe

  # ------------------------------------------------------------------
  # Ubuntu：不出冻结二进制，改成「apt 依赖 + 系统 python3 的 venv + 纯 Python wheel」，
  # 并且**在 ubuntu:26.10 的容器里把用户那条命令原样跑一遍**。
  #
  # 为什么撤掉 Nuitka 那条路：右键菜单只有 pystray 的 appindicator/gtk 后端渲染得出来，
  # 而这两个后端要 apt 的 gi（PyGObject）+ GTK3 + appindicator 的 typelib，pip 装不出 gi。
  # 以前 Nuitka 会把编译机（24.04）那份 gi 连同系统的整目录 typelib 快照一起打进产物，
  # 运行时还把 GI_TYPELIB_PATH 指到快照目录（gi 插件的逻辑：环境变量没设就设成它），于是
  # 目标机自己那套 GTK3/gi 跟快照各说各话。Ubuntu 26.10（gi 3.57、gtk 3.24.52、g-i 1.86）
  # 上的现场就是一句没有文字的 AssertionError——`gi/overrides/Gdk.py` 里那句
  # `assert g_type != TYPE_NONE`：typelib 从快照读到了，但本机那个 libgdk 给不出 GdkColor
  # 的 GType。CI 却在编译机上全绿：快照同时把「目标机缺东西」这件事糊住了。产物能不能对上
  # 目标机的 gi 全靠运气，所以整条撤掉，Linux 只留 wheel + 安装脚本。
  #
  # 现在 CI 测的就是目标发行版本身：容器里跑 scripts/install-linux.sh（apt → venv → pip 装
  # 刚编出来的 wheel → 真起一次托盘），硬门槛照旧是「后端是带菜单的那两个」。
  # ------------------------------------------------------------------
  install-ubuntu:
    name: Ubuntu 26.10 install
    runs-on: ubuntu-latest
    needs: build
    # Windows job 失败也照样出 Linux 包：两个平台的编译不该互相绑死
    if: ${{ !cancelled() }}
    container:
      image: ubuntu:26.10
      options: --user root
    permissions:
      contents: write
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      # 容器 job 的 actions/checkout 要用镜像里的 git/curl/tar，ubuntu 基础镜像不保证有。
      # xvfb 与 dbus 是给安装脚本最后那步自检用的（容器里没有图形会话，appindicator 又要
      # 会话总线，dbus-run-session + xvfb-run 才能把托盘真起起来）
      - name: Bootstrap the container
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git curl ca-certificates tar \
            python3 python3-venv python3-pip xvfb dbus

      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        run: echo "value=$(sed -n 's/^version = "\([^"]*\)".*/\1/p' pyproject.toml | head -1)" >> "$GITHUB_OUTPUT"

      # 纯 Python、没有 C 扩展，所以一个 py3-none-any 通吃 3.12/3.13/3.14。gi 故意不进 wheel，
      # 由 apt 提供——这正是同一个包能跨发行版的原因，也是与 Nuitka 那条路的根本区别。
      # 系统 python 被 PEP 668 标成 externally-managed，所以 uv 装在临时 venv 里，不用
      # --break-system-packages 去动系统环境。
      - name: Build wheel
        run: |
          python3 -m venv .venv-build
          .venv-build/bin/python -m pip install --quiet uv
          .venv-build/bin/uv build --wheel --out-dir dist-wheel
          ls -l dist-wheel

      # 用户在 26.10 上敲的就是同一条命令，这里只是把「从 Releases 下载 wheel」换成刚编出来的本地文件
      - name: Run the installer
        run: |
          SHUNSHU_WHEEL="$GITHUB_WORKSPACE/dist-wheel/shunshu-${{ steps.version.outputs.value }}-py3-none-any.whl" \
            bash scripts/install-linux.sh

      - name: Show what got installed
        run: |
          venv="$HOME/.local/share/shunshu/venv"
          "$venv/bin/python" -c "import shunshu, sys; print('shunshu', shunshu.__version__, '/ python', sys.version.split()[0])"
          "$venv/bin/python" -c "import gi; gi.require_version('Gtk', '3.0'); \
            from gi.repository import Gtk, Gdk; print('apt 那份 gi 的 Gdk:', Gdk._version)"
          ls -l "$HOME/.local/share/shunshu/data" || true
          echo "--- 自检那 15 秒的输出 ---"; cat /tmp/shunshu-selfcheck.log || true
          tail -n 20 "$HOME/.local/share/shunshu/data/shunshu.log" || true

      # 同一套用例在目标发行版 + 系统解释器上再跑一遍：Linux 那几条平台分支只有这里才真跑到
      - name: Run tests on the installed venv
        run: |
          venv="$HOME/.local/share/shunshu/venv"
          "$venv/bin/python" -m pip install --quiet pytest
          xvfb-run -a "$venv/bin/python" -m pytest tests -q

      - name: Resolve release tag
        id: tag
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "name=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=v${{ steps.version.outputs.value }}" >> "$GITHUB_OUTPUT"
          fi

      # 与 Windows 那步同一份脚本、同一份正文（纯标准库，系统 python3 就够）
      - name: Build release notes
        run: python3 scripts/release_notes.py --version "${{ steps.tag.outputs.name }}" --out release-notes.md

      # Windows job 已经建过同名 tag 的 Release，这里是往同一个 Release 追加文件，不会建出第二个
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          body_path: release-notes.md
          fail_on_unmatched_files: true
          files: |
            dist-wheel/shunshu-*.whl
            scripts/install-linux.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: shunshu-ubuntu-wheel
          path: |
            dist-wheel/shunshu-*.whl
            scripts/install-linux.sh
          if-no-files-found: error
          retention-days: 7
