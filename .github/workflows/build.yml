# GitHub Actions：Windows 下用 Nuitka 编译 shunshu 成 standalone 目录。
#
# 触发方式：
#   1. push 到 main 分支 → 跑测试 + 打包，产物上传到 Actions Artifacts
#   2. push tag v*       → 跑测试 + 打包，自动创建 GitHub Release 并把 zip 挂上去
#   3. 手动 dispatch      → 和 main 分支一样
#
# 产物结构（folder 模式）：
#   shunshu-{版本}-windows-amd64.zip
#     ├── shunshu.exe            ← 主程序 + popup 子命令，同一个 exe
#     └── 运行时依赖（含 zhconv 词库、Tk、pystray/PIL 后端）

name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    name: Windows Build
    runs-on: windows-latest
    outputs:
      release_created: ${{ steps.create_release.outputs.id != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: "uv"

      - name: Install uv
        run: pip install uv

      - name: Sync dependencies (including dev + nuitka)
        run: uv sync --group dev

      - name: Run tests
        run: uv run pytest tests/ -v

      # ---------- Nuitka 编译 ----------
      # windows-latest 自带 MSVC，Nuitka 自动找到不需要 --zig
      - name: Nuitka compile (standalone folder)
        run: |
          uv run python -m nuitka `
            --standalone `
            --windows-console-mode=disable `
            --enable-plugin=tk-inter `
            --include-module=zhconv `
            --include-package-data=zhconv `
            --include-module=truststore `
            --output-dir=dist `
            src/shunshu/__main__.py `
            --output-filename=shunshu.exe

      # ---------- 打包 zip ----------
      - name: Package zip
        shell: pwsh
        run: |
          $version = (Select-String -Path pyproject.toml -Pattern '^version = "(.+?)"').Matches.Groups[1].Value
          $dir = "dist\__main__.dist"
          $zip = "shunshu-$version-windows-amd64.zip"
          # 把 exe 提到根目录，_internal 放旁边，和 PyInstaller 产物结构一致
          Compress-Archive -Path "$dir\*" -DestinationPath $zip -CompressionLevel Optimal
          Write-Host "Created $zip ($([math]::Round((Get-Item $zip).Length / 1MB, 1)) MB)"

      # ---------- 上传到 Actions Artifacts ----------
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: shunshu-windows-amd64
          path: "shunshu-*.zip"
          if-no-files-found: error
          retention-days: 7

      # ---------- Tag push 自动创建 Release ----------
      - name: Create GitHub Release
        id: create_release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Shunshu ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            shunshu-*.zip
