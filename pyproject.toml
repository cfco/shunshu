[project]
name = "shunshu"
version = "0.16.0"
description = "小说目录页更新监控：托盘常驻 + 桌面弹窗提醒（Windows / Ubuntu）"
readme = "README.md"
authors = [
    { name = "minyaohua", email = "minyaohua@gmail.com" }
]
# >=3.12 而不是 3.14：Ubuntu 24.04 / Zorin 18 的 apt python3 就是 3.12，而托盘右键菜单
# 要的后端只能来自 apt 的 python3-gi（pip 装不出 gi）。代码本身没有 3.13+ 的特性
# （只用 dataclass(slots=True) 这类 3.10 就有的），3.12 上全量用例实跑通过。
# 本机开发仍由 .python-version 钉在 3.14 上，uv 不会自己降。
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "lxml>=6.1.3",
    "pillow>=12.3.0",
    "pystray>=0.19.5",
    "PySocks>=1.7.1",
    "requests>=2.34.2",
    "zhconv>=1.4.3",
    "truststore>=0.10.4",
]

[project.scripts]
shunshu = "shunshu.cli:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "nuitka>=4.2.2",
    "ordered-set>=4.1.0",
    "pytest>=9.1.1",
    "zstandard>=0.25.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# "." 是给 tests/test_release_notes.py 用的：它要 import scripts/release_notes.py
# （CI 发布页正文的取文本逻辑），那个目录不是包，只能靠根目录进 sys.path
pythonpath = ["src", "."]
