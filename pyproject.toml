[project]
name = "shunshu"
version = "0.6.4"
description = "小说目录页更新监控：托盘常驻 + Windows 弹窗提醒"
readme = "README.md"
authors = [
    { name = "minyaohua", email = "minyaohua@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "lxml>=6.1.3",
    "pillow>=12.3.0",
    "pystray>=0.19.5",
    "PySocks>=1.7.1",
    "requests>=2.34.2",
    "zhconv>=1.4.3",
    "truststore>=0.10.4",
]

[project.scripts]
shunshu = "shunshu.cli:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "nuitka>=4.2.2",
    "ordered-set>=4.1.0",
    "pytest>=9.1.1",
    "zstandard>=0.25.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
