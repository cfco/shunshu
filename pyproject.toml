[project]
name = "shunshu"
version = "0.19.1"
description = "小说目录页更新监控：托盘常驻 + 桌面弹窗提醒（Windows / Ubuntu）"
readme = "README.md"
authors = [
    { name = "minyaohua", email = "minyaohua@gmail.com" }
]
# >=3.12 而不是 3.14：Linux 的托盘右键菜单要的后端只能来自 apt 的 python3-gi（pip 装不出），
# 而它绑死系统解释器——Ubuntu 24.04 / Zorin 18 是 3.12，Ubuntu 26.10 是 3.14。二进制包在
# ubuntu:26.10 的容器里编（与目标机同版本），wheel + install-linux.sh 那条路则跟着目标机的
# python3 走，所以下限仍是 3.12。代码本身没有 3.13+ 的特性（最狠的是 dataclass(slots=True)，
# 3.10 就有）。本机开发由 .python-version 钉在 3.14，uv 不会自己降。
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "lxml>=6.1.3",
    "pillow>=12.3.0",
    "pystray>=0.19.5",
    "PySocks>=1.7.1",
    "requests>=2.34.2",
    "zhconv>=1.4.3",
    "truststore>=0.10.4",
]

[project.scripts]
shunshu = "shunshu.cli:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "nuitka>=4.2.2",
    "ordered-set>=4.1.0",
    "pytest>=9.1.1",
    "zstandard>=0.25.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# "." 是给 tests/test_release_notes.py 用的：它要 import scripts/release_notes.py
# （CI 发布页正文的取文本逻辑），那个目录不是包，只能靠根目录进 sys.path
pythonpath = ["src", "."]
